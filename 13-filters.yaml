- name: demo on filters
  hosts: localhost
  connection: local
  vars:
    topics: Linux, Shell, Ansible, Terraform
    tagMap:
      name: Ansible
      project: roboshop
      environment: dev
    tagList: [
        {
            "key": "name",
            "value": "Ansible"
        },
        {
            "key": "project",
            "value": "roboshop"
        },
        {
            "key": "environment",
            "value": "dev"
        }
    ]

  tasks:  
    - name: convert string to list
      debug:
        msg: "Topics acre: {{topics | split(',')}}"

    - name: set default value
      debug:
        msg: "Hi {{ GREETINGS | default('Good morning')}}"        

    - name: convert map to list
      debug:
        msg: "{{tagMap | dict2items }}"    

    - name: convert list to map
      debug:
        msg: "{{tagList | items2dict }}"   