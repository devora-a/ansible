- name: demo on tasklevel variables
  host: localhost
  connection: local # it will not ask of user name and password
  vars:
    COURSE: "Ansible"
    TRAINER: "shivakumar"
    DURATION: "150hrs"
  tasks:
  - name: print information
    vars:
      COURSE: "DevsecOps with AIOps"
    debug:
      msg: "Hi, I am learning {{COURSE}}, Trainer is {{TRAINER}}, Duration is {{DURATION}}" 